<div class="slideshow-container">
<a class="prev" onclick="plusSlides(-1)" title="prev">❮</a>
<a class="next" onclick="plusSlides(1)" title="next">❯</a>
{% for image in site.static_files %}
  {% if image.path contains include.gallery_path %}
    {% unless image.path contains '.md' %}
      <div class="mySlides fade">
        <a href="{{ image.path | relative_url }}" data-lightbox="{{ gallery-name | markdownify }}" data-title="{{ gallery-name | markdownify }}">
        <img src="{{ image.path | relative_url }}" alt="{{ gallery-name | markdownify }}" loading="lazy" /></a>
      </div>
    {% endunless %}
  {% endif %}
{% endfor %}
</div>
