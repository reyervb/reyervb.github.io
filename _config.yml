baseurl: ""
url: "https://reyervb.github.io"

#SEO
description: REYER is choreographer, curator, and producer working across multidisciplinary performance, nightlife, and embodied research, whose experimental practice mobi..
logo: /assets/img/reyerlogo.png
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/reyerlogo.png

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-minifier
permalink: /:title

jekyll-minifier:
  compress_javascript: true
  compress_css: true
  remove_comments: true

defaults:
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"